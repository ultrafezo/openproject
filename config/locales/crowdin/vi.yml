  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Tùy chọn: Khóa thuộc tính trong LDAP mà <strong>nếu có</strong> đánh dấu người dùng OpenProject là quản trị viên. Để trống khi nghi ngờ.'
      base_dn: |
        Nhập Base DN của cây con trong LDAP mà bạn muốn OpenProject tìm kiếm người dùng và nhóm.
        OpenProject sẽ chỉ lọc tên người dùng được cung cấp trong cây con này.
        Ví dụ: ou=users,dc=example,dc=com
      filter_string: |
        Thêm bộ lọc RFC4515 tùy chọn để áp dụng cho kết quả trả về cho người dùng được lọc trong LDAP.
        Điều này có thể được sử dụng để hạn chế nhóm người dùng được OpenProject tìm thấy để xác thực và đồng bộ hóa nhóm.
      filter_string_concat: |
        OpenProject sẽ luôn lọc thuộc tính đăng nhập do người dùng cung cấp để xác định bản ghi. Nếu bạn cung cấp bộ lọc ở đây,
        nó sẽ được nối với AND. Theo mặc định, tổng hợp (objectClass=*) sẽ được sử dụng làm bộ lọc.
      generic_map: |-
        84/5000
        Khóa thuộc tính trong LDAP được ánh xạ tới thuộc tính `%{attribute}` của OpenProject
      host: Tên máy chủ LDAP hoặc địa chỉ IP
      login_map: Khóa thuộc tính trong LDAP được sử dụng để xác định thông tin đăng nhập người dùng duy nhất. Thông thường, đây sẽ là `uid` hoặc` samAccountName`.
      name: Tên tùy ý của kết nối LDAP
      onthefly_register: |
        Nếu bạn chọn hộp này, OpenProject sẽ tự động tạo người dùng mới từ các mục LDAP của họ
        khi họ xác thực lần đầu bằng OpenProject.
        Bỏ chọn mục này để chỉ cho phép các tài khoản hiện có trong OpenProject xác thực thông qua LDAP!
      system_user_dn_html: |
        Nhập DN của người dùng hệ thống được sử dụng để truy cập chỉ đọc.
        <br>
        Ví dụ: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Nhập mật khẩu liên kết của người dùng hệ thống
    back_to_index: Bấm vào đây để quay lại danh sách kết nối.
