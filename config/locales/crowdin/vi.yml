      Các trường sau đây liên quan đến cách người dùng được tạo trong OpenProject từ các mục nhập LDAP và
      thuộc tính LDAP nào được sử dụng để xác định thuộc tính của người dùng OpenProject (ánh xạ thuộc tính).
