        '
    authentication:
      login: "Đăng nhập"
      omniauth_direct_login_hint_html: 'Nếu tùy chọn này đang hoạt động, yêu cầu đăng nhập sẽ chuyển hướng đến nhà cung cấp omniauth đã định cấu hình. Trang đăng nhập thả xuống và trang đăng nhập sẽ bị vô hiệu hóa. <br/> <strong>Lưu ý:</strong> Trừ khi bạn cũng tắt tính năng đăng nhập bằng mật khẩu, khi bật tùy chọn này, người dùng vẫn có thể đăng nhập nội bộ bằng cách truy cập trang đăng nhập <code>%{internal_path}</code>.

        '
      password_login_bypass_principal_ids_hint: "Ngay cả khi đăng nhập bằng mật khẩu bị tắt, các người dùng và nhóm này vẫn sẽ có thể sử dụng mật khẩu của họ để đăng nhập. Điều này rất hữu ích, ví dụ, khi nhà cung cấp định danh trở nên không khả dụng. Nếu bạn bao gồm một nhóm, quyền truy cập sẽ được mở rộng tới tất cả người dùng trong nhóm đó."

      password_login_configured_by_environment: "Các cài đặt sau đây được cấu hình thông qua môi trường và không thể sửa ở đây:"

      password_login_requires_sso_provider: "Các hạn chế đăng nhập bằng mật khẩu không khả dụng vì hiện chưa có nhà cung cấp SSO nào được bật. Hãy cấu hình và bật một nhà cung cấp SSO trước khi thay đổi các cài đặt này."

