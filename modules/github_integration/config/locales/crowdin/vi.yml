  text_deploy_target_api_key_info: 'OpenProject [API key](docs_url) thuộc về người dùng có quyền xem xét nội tâm toàn cầu.

    '
  text_deploy_target_type_info: 'Cho đến nay chúng tôi chỉ hỗ trợ OpenProject.

    '
  text_github_comment_user_info: "Người dùng OpenProject mà khoá API của người đó phải được dùng để xác thực các yêu cầu webhook đi vào. Khi được đặt, các yêu cầu được xác thực bởi chứng chỉ của bất kỳ người dùng nào khác đều bị từ chối. Người dùng này cũng đăng các nhận xét trạng thái triển khai tự động trên các gói công việc. Mặc định là người dùng hệ thống khi không được đặt."

  text_github_webhook_secret_info: "Một mã bí mật được chia sẻ với GitHub khi định cấu hình webhook. Khi được đặt, OpenProject xác thực header X-Hub-Signature-256 cho mọi yêu cầu gửi đến, từ chối các dữ liệu tải không khớp. Để trống để bỏ qua bước xác thực (không được khuyến nghị).\n"

  text_github_webhook_secret_missing_warning: "Chưa có bí mật webhook nào được định cấu hình. Bất kỳ yêu cầu nào đến điểm cuối webhook GitHub sẽ được chấp nhận mà không qua xác thực, điều này có thể cho phép các tác nhân không được ủy quyền giả mạo các sự kiện. Khuyến nghị mạnh rằng bạn nên đặt một bí mật.\n"

  text_pull_request_deployed_to: "%{pr_link} được triển khai tới %{deploy_target_link}"
