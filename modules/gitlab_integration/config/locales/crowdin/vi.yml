    note_issue_referenced_comment: "**Tham Chiếu Trong Vấn Đề:** [%{gitlab_user}](%{gitlab_user_url}) đã tham chiếu WP này trong Vấn đề %{issue_number} [%{issue_title}](%{issue_url}) trên [%{repository}](%{repository_url}): %{issue_note}\n"
    note_mr_commented_comment: "**Bình Luận Trong MR:** [%{gitlab_user}](%{gitlab_user_url}) đã bình luận về WP này trong Yêu cầu kéo %{mr_number} [%{mr_title}](%{mr_url}) trên [%{repository}](%{repository_url}): %{mr_note}\n"
    note_mr_referenced_comment: "**Tham Chiếu Trong MR:** [%{gitlab_user}](%{gitlab_user_url}) đã tham chiếu WP này trong Yêu cầu kéo %{mr_number} [%{mr_title}](%{mr_url}) trên [%{repository}](%{repository_url}): %{mr_note}\n"
    note_snippet_referenced_comment: "**Tham Chiếu Trong Đoạn Mã:** [%{gitlab_user}](%{gitlab_user_url}) đã tham chiếu WP này trong Đoạn mã %{snippet_number} [%{snippet_title}](%{snippet_url}) trên [%{repository}](%{repository_url}): %{snippet_note}\n"
    push_multiple_commits_comment: "**Đã Đẩy Trong MR:** [%{gitlab_user}](%{gitlab_user_url}) đã đẩy nhiều commit [%{commit_number}](%{commit_url}) lên [%{repository}](%{repository_url}) vào %{commit_timestamp}: %{commit_note}\n"
    push_single_commit_comment: "**Đã Đẩy Trong MR:** [%{gitlab_user}](%{gitlab_user_url}) đã đẩy [%{commit_number}](%{commit_url}) lên [%{repository}](%{repository_url}) vào %{commit_timestamp}: %{commit_note}\n"
    push_single_commit_comment_with_ref: "**Đã đẩy vào %{reference}:** [%{gitlab_user}](%{gitlab_user_url}) đã đẩy [%{commit_number}](%{commit_url}) vào [%{repository}](%{repository_url}) tại %{commit_timestamp}: %{commit_note}\n"
  label_gitlab_actor: "Tác nhân GitLab"
  label_gitlab_integration: "Tích hợp GitLab"
  label_gitlab_webhook_secret: "Bí mật webhook"
  permission_show_gitlab_content: Hiển thị nội dung GitLab
  project_module_gitlab: GitLab
  text_gitlab_actor_info: "Người dùng OpenProject mà khoá API của người đó phải được dùng để xác thực các yêu cầu webhook đi vào. Khi được đặt, các yêu cầu được xác thực bởi chứng chỉ của bất kỳ người dùng nào khác đều bị từ chối. Người dùng này cũng đăng các nhận xét tự động trên các gói công việc. Mặc định là người dùng hệ thống khi không được đặt."

  text_gitlab_webhook_secret_info: "Một mã bí mật được chia sẻ với GitLab khi định cấu hình webhook. Khi được đặt, OpenProject xác thực header X-Gitlab-Token cho mọi yêu cầu gửi đến, từ chối các dữ liệu tải không khớp. Để trống để bỏ qua bước xác thực (không được khuyến nghị).\n"

  text_gitlab_webhook_secret_missing_warning: "Chưa có bí mật webhook nào được định cấu hình. Bất kỳ yêu cầu nào đến điểm cuối webhook GitLab sẽ được chấp nhận mà không qua xác thực, điều này có thể cho phép các tác nhân không được ủy quyền giả mạo các sự kiện. Khuyến nghị mạnh rằng bạn nên đặt một bí mật.\n"

