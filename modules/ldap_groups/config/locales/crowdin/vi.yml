          '
      help_text_html: "Mô-đun này cho phép bạn thiết lập một lần đồng bộ giữa LDAP và các nhóm OpenProject.\n<br/>\nTheo mặc định, OpenProject sử dụng <strong>tra cứu ngược</strong>: nó tìm những người dùng có thuộc tính <em>memberOf</em> khớp với DN của nhóm.\nĐiều này đòi hỏi thuộc tính <em>memberOf</em> phải hiện diện trên các mục nhập người dùng (Active Directory, OpenLDAP với lớp phủ memberof).\n<br/>\nNếu máy chủ LDAP của bạn không duy trì <em>memberOf</em> trên các mục nhập người dùng (ví dụ nó sử dụng <em>groupOfUniqueNames</em> với <em>uniqueMember</em>),\nbạn có thể định cấu hình <strong>tra cứu thuận</strong> bằng cách đặt <em>Thuộc tính thành viên nhóm</em> trên bộ lọc đồng bộ.\n<br/>\nCác nhóm được đồng bộ theo giờ thông qua một tác vụ cron.\n[Vui lòng xem tài liệu của chúng tôi về chủ đề này](docs_url).\n"
