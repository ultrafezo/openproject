  text_email_updates_enabled: Cập nhật lịch email được kích hoạt. Tất cả người tham gia sẽ nhận được lời mời cập nhật qua email khi bạn thực hiện thay đổi.
  text_email_updates_muted: Cập nhật lịch email bị tắt tiếng. Người tham gia sẽ không nhận được lời mời cập nhật qua email khi bạn thực hiện thay đổi.
