      description: 'Những ngày bên dưới đang tham chiếu múi giờ của chuỗi cuộc họp (%{actual_zone}), không phải múi giờ địa phương của bạn (%{user_zone}).

        '
      title: Chênh lệch múi giờ
  text_add_work_package_to_meeting_description: Một gói công việc có thể được thêm vào một hoặc nhiều cuộc họp để thảo luận. Bất kỳ ghi chú nào liên quan đến nó cũng có thể nhìn thấy ở đây.
  text_add_work_package_to_meeting_form: Gói công việc sẽ được thêm vào cuộc họp đã chọn hoặc Backlog dưới dạng mục chương trình nghị sự.
  text_agenda_backlog: 'Backlog này là duy nhất cho cuộc họp một lần này. Bạn có thể kéo các mục vào và ra để thêm hoặc xóa chúng khỏi chương trình cuộc họp.

    '
  text_agenda_backlog_clear_description: 'Bạn có chắc chắn muốn xóa tất cả các mục hiện có trong Backlog cuộc họp không? Hành động này không thể đảo ngược.

    '
  text_agenda_item_dialog_skipping_cancelled_many: "%{count} cuộc họp đã hủy"
