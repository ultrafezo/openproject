  text_in_hours: bằng giờ
  text_meeting_agenda_for_meeting: Các ý chính cho cuộc họp "%{meeting}"
  text_meeting_agenda_open_are_you_sure: Điều này sẽ ghi đè lên tất cả các thay đổi trong vài phút! Bạn có muốn tiếp tục không?
  text_meeting_closed_description: Cuộc họp này đã kết thúc. Bạn không thể thêm/xóa các mục trong chương trình nghị sự nữa.
  text_meeting_closed_dropdown_description: Cuộc họp này đã kết thúc. Bạn không thể sửa đổi các mục hoặc kết quả của chương trình nghị sự nữa.
  text_meeting_closing_are_you_sure: Bạn có chắc chắn muốn đóng chương trình cuộc họp không?
  text_meeting_draft_banner: Bạn hiện đang ở chế độ nháp. Cuộc họp này sẽ không gửi bất kỳ cập nhật lịch hoặc lời mời nào, ngay cả khi bạn thay đổi chi tiết cuộc họp hoặc thêm/xóa người tham gia.
  text_meeting_draft_description: Chuẩn bị chương trình nghị sự của bạn ở chế độ dự thảo. Cuộc họp này sẽ không gửi bất kỳ cập nhật lịch hoặc lời mời nào, ngay cả khi bạn thay đổi chi tiết cuộc họp hoặc thêm/xóa người tham gia.
  text_meeting_empty_description1: Bắt đầu bằng cách thêm các mục chương trình nghị sự bên dưới. Mỗi mục có thể đơn giản chỉ là tiêu đề nhưng bạn cũng có thể thêm các chi tiết bổ sung như thời lượng và ghi chú.
  text_meeting_empty_description2: Bạn cũng có thể thêm tài liệu tham khảo vào các gói công việc hiện có. Khi bạn làm như vậy, các ghi chú liên quan sẽ tự động hiển thị trong tab "Cuộc họp" của gói công việc.
  text_meeting_empty_heading: Cuộc họp của bạn trống
  text_meeting_ics_description: 'Link cuộc họp: %{url}'
  text_meeting_ics_meeting_series_description: 'Link chuỗi cuộc họp: %{url}'
  text_meeting_in_progress_description: Bạn có thể sửa đổi chương trình nghị sự, ghi lại kết quả cho từng mục và theo dõi sự tham dự của người tham gia. Sau khi cuộc họp kết thúc, bạn có thể đánh dấu cuộc họp là đã đóng để khóa cuộc họp.
  text_meeting_in_progress_dropdown_description: Ghi lại các kết quả như nhu cầu thông tin hoặc các quyết định được đưa ra trong cuộc họp.
  text_meeting_minutes_for_meeting: biên bản cuộc họp "%{meeting}"
  text_meeting_not_editable_anymore: Cuộc họp này không thể chỉnh sửa được nữa.
  text_meeting_not_present_anymore: Cuộc họp này đã bị xóa. Vui lòng chọn một cuộc họp khác.
  text_meeting_occurrence_ics_description: 'Link diễn ra cuộc họp: %{url} Link chuỗi cuộc họp: %{series_url}'
  text_meeting_open_description: Bạn có thể thêm/xóa các mục chương trình nghị sự và người tham gia. Khi chương trình nghị sự đã sẵn sàng, hãy đánh dấu nó là đang tiến hành để ghi lại kết quả.
  text_meeting_open_dropdown_description: Mọi kết quả hiện có sẽ vẫn giữ nguyên nhưng người dùng sẽ không thể thêm kết quả mới.
  text_meeting_series_end_early: Việc kết thúc chuỗi sẽ xóa mọi cuộc họp mở hoặc đã lên lịch trong tương lai
  text_meeting_series_end_early_heading: Xóa các lần xuất hiện trong tương lai?
  text_meeting_template_blank_slate: "Bạn có thể tạo một mẫu mới cho các cuộc họp một lần"
  text_meeting_template_blank_slate_heading: "Không có mẫu nào để hiển thị"
  text_meeting_template_sharing_description: "Mẫu này có thể được chia sẻ với các dự án con hoặc các dự án khác trong bản cài đặt này. Chỉ các mục chương trình nghị sự và các tập tin đính kèm sẽ được sao chép."
  text_notificiation_invited: 'Thư này chứa mục nhập ics cho cuộc họp bên dưới:'
  text_onetime_meeting_template_banner: "Bạn đang chỉnh sửa một mẫu cuộc họp. Bạn có thể dùng mẫu này để tạo các cuộc họp một lần với một chương trình nghị sự định sẵn. Các thay đổi sẽ không ảnh hưởng tới các cuộc họp đã được tạo."
  text_onetime_meeting_template_empty_description: "Thêm các mục chương trình nghị sự, các phần và các tập tin đính kèm ở đây. Chúng sẽ được đưa vào mọi cuộc họp được tạo bằng mẫu này."
  text_onetime_meeting_template_empty_heading: "Mẫu cuộc họp này còn trống"
  text_outcome_cannot_be_added: Một kết quả không còn có thể được thêm vào.
  text_outcome_not_editable_anymore: Kết quả này không thể chỉnh sửa được nữa.
  text_series_backlog: 'Backlog được chia sẻ với tất cả các lần xuất hiện của loạt bài này. Bạn có thể kéo các mục vào và ra để thêm hoặc xóa chúng khỏi một cuộc họp cụ thể.

    '
  text_series_backlog_clear_description: 'Thao tác này sẽ xóa tất cả các mục trong Backlog của chuỗi cuộc họp, được chia sẻ với tất cả các cuộc họp trong chuỗi. Bạn có chắc chắn muốn tiếp tục không? Hành động này không thể đảo ngược.

    '
  text_work_package_add_to_meeting_hint: Sử dụng nút "Thêm vào cuộc họp" để thêm gói công việc này vào cuộc họp sắp tới.
  text_work_package_has_no_past_meeting_agenda_items: Gói công việc này chưa được thêm vào làm mục chương trình nghị sự trong cuộc họp trước đây.
  text_work_package_has_no_upcoming_meeting_agenda_items: Gói công việc này chưa được lên lịch trong chương trình họp sắp tới.

  label_recurring_meeting: "Cuộc họp định kỳ"