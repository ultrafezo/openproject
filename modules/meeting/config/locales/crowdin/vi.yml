      description: 'Mẫu này sẽ được sử dụng bất cứ khi nào các cuộc họp mới trong chuỗi được tạo. Bạn có thể thêm các mục chương trình nghị sự, người tham gia và tệp đính kèm vào mẫu này.

        '
      draft_banner_html: 'Bạn hiện đang chỉnh sửa mẫu chuỗi cuộc họp: %{link}. Mọi cuộc họp mới diễn ra trong chuỗi cuộc họp sẽ sử dụng mẫu này. Những thay đổi sẽ không ảnh hưởng đến các cuộc họp trong quá khứ hoặc đã được tạo. Sẽ không có lời mời qua email nào được gửi ở chế độ nháp hiện tại này cho đến khi bạn mở cuộc họp đầu tiên.

        '
